# ============================================================
# base.yaml —— ① 科学设定（两人必须完全一致）
# ------------------------------------------------------------
# 这里放的是"影响实验结论"的东西：数据、模型、损失、训练轮数、评测集、随机种子。
# 任何一台机器都不允许用 local 配置覆盖这里的字段。
#
# 三层合并顺序（后面的覆盖前面的）：
#   base.yaml  →  profiles/<档位>.yaml  →  configs/exp/<实验>.yaml  →  local.<机器>.yaml
# ============================================================

seed: 0

data:
  # manifest 是数据的唯一索引（每行一个 JSON），见 docs/FRAMEWORK.md §3.3 契约 A
  manifest: data/manifests/toy_train.jsonl
  # 对齐后的标准尺寸：ArcFace 模板，训练与评测必须一致
  image_size: 112
  align: arcface_112

model:
  arch: iresnet18          # W2 先用小模型跑通，跑通后可换 iresnet50
  emb_dim: 512
  loss: arcface
  margin: 0.5
  scale: 64.0

train:
  # ⚠️ 10 -> 30 是**基于实测**的调整（2026-10-01，E1 首次训练）：
  #    10 轮结束时 loss 仍在快速下降（4.78 -> 4.33）、lr 刚退火到 0、
  #    训练准确率仅 0.588 —— 典型的**欠训练**。训练只要 24 秒/轮，
  #    30 轮约 12 分钟，代价可忽略，但基线会明显更可信。
  #    （所有实验必须用同一个 epochs，否则各臂不可比。）
  epochs: 30
  lr: 0.1
  optimizer: sgd
  momentum: 0.9
  weight_decay: 5.0e-4
  # 数据组成（E1 基线：只用真实数据）
  real_only: true
  mix_ratio: 0.0           # 合成图占比 = 合成图数 / (真实图数 + 合成图数)，仅 real_only=false 时有意义

eval:
  # W2 先只做 LFW；后续再加 cfp_fp / agedb_30
  benchmarks: [lfw]
  protocol: lfw_10fold
  flip_test: true
  # 一张图里检出多张脸时选哪张：center / score / area
  # ⚠️ 2026-10-01 实测（LFW 官方 6000 对）：这一项直接决定 2.6 个百分点的准确率 ——
  #    选"面积最大"会把背景里的误检框裁进来，同人相似度掉到 -0.03。
  #    假拒绝恢复率：center 96.7% > score 91.7% > area 0%。
  #    LFW 与生成图都是"单人居中"，所以 center 是正确默认值。**不要改成 area。**
  face_select: center
